name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Nix checks and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Validate source and build all checks
        run: nix flake check --no-update-lock-file --print-build-logs

      - name: Build deployment artifacts without activation
        run: |
          nix build --no-link --no-update-lock-file .#arch-workstation .#arch-switch
          if [[ "$(nix eval --json --no-update-lock-file .#lib.runnerctlEnabled)" == "true" ]]; then
            nix build --no-link --no-update-lock-file .#runnerctl
          fi

      - name: Ensure validation left the checkout unchanged
        run: git diff --exit-code
