name: Container deployment

# Deploys the container-test configuration into a disposable systemd Arch
# container on the hosted runner. It is slow, so it runs only when deployment
# sources change on main, weekly, or on request.
on:
  push:
    branches: [main]
    paths:
      - configuration.nix
      - flake.lock
      - flake.nix
      - hosts/**
      - lib/**
      - modules/**
      - platforms/**
      - scripts/**
      - checks/container/**
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Bootstrap, update, repeat and purge
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # The full desktop package set needs more space than the image leaves.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Restore package caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/volumes
          key: container-packages-${{ github.run_id }}
          restore-keys: container-packages-

      # Volume export/import keeps file ownership inside the user namespace.
      - name: Import package caches into podman volumes
        run: |
          for volume in nix-config-container-pacman nix-config-container-yay; do
            podman volume create "$volume" >/dev/null
            archive="$RUNNER_TEMP/volumes/$volume.tar"
            if [[ -f $archive ]]; then podman volume import "$volume" "$archive"; fi
          done

      - name: Run the container smoke test
        run: nix run --no-update-lock-file .#just -- container-test

      - name: Export package caches
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/volumes"
          for volume in nix-config-container-pacman nix-config-container-yay; do
            podman volume export "$volume" --output "$RUNNER_TEMP/volumes/$volume.tar"
          done

      - name: Save package caches
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/volumes
          key: container-packages-${{ github.run_id }}
