name: Validate Deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_deployment:
    name: Validate Nix Sources and Fixture Deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check Out Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run Flake Checks and Build Their Deployment Dependencies
        id: check
        shell: bash # adds pipefail, so tee cannot mask a failed check
        run: |
          nix flake check --no-update-lock-file --print-build-logs --keep-going 2>&1 |
            tee "$RUNNER_TEMP/check.log"

      # Annotations are readable without downloading the job log.
      - name: Report Failing Checks
        if: failure() && steps.check.outcome == 'failure'
        run: |
          report=$(grep -v '^warning:' "$RUNNER_TEMP/check.log" | grep -E -A15 '^error:' | tail -n 80)
          report=${report:-$(tail -n 40 "$RUNNER_TEMP/check.log")}
          report=${report//'%'/'%25'}
          echo "::error title=nix flake check::${report//$'\n'/'%0A'}"
