name: Test Deployment Lifecycle

# Deploys the container-test configuration into a disposable systemd Arch
# container on the hosted runner. It is slow, so it runs only when deployment
# sources change on main, weekly, or on request.
on:
  push:
    branches: [main]
    paths:
      - flake.lock
      - flake.nix
      - lib/**
      - modules/**
      - platforms/**
      - scripts/**
      - templates/**
      - checks/container/**
      - .github/workflows/test-deployment-lifecycle.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_deployment_lifecycle:
    name: Test Bootstrap, Convergence, Purge and Installation
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check Out Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The full desktop package set needs more space than the image leaves.
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Restore Package Caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/volumes
          key: container-packages-${{ github.run_id }}
          restore-keys: container-packages-

      # Volume export/import keeps file ownership inside the user namespace.
      - name: Import Package Caches into Podman Volumes
        run: |
          for volume in nacre-container-pacman nacre-container-yay; do
            podman volume create "$volume" >/dev/null
            archive="$RUNNER_TEMP/volumes/$volume.tar"
            if [[ -f $archive ]]; then podman volume import "$volume" "$archive"; fi
          done

      - name: Exercise Deployment Lifecycle in Disposable Arch
        run: nix run --no-update-lock-file .#just -- container-test

      - name: Export Package Caches
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/volumes"
          for volume in nacre-container-pacman nacre-container-yay; do
            podman volume export "$volume" --output "$RUNNER_TEMP/volumes/$volume.tar"
          done

      - name: Save Package Caches
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/volumes
          key: container-packages-${{ github.run_id }}
