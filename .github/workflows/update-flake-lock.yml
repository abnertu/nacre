name: Propose flake input updates

# Proposes a reviewed lock update; merging the pull request is the intentional
# adoption step. Pull requests opened with GITHUB_TOKEN start no workflows, but
# workflow_dispatch does, so this job dispatches the checks and the container
# deployment on the pull request branch, where their results show on it.
on:
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  update:
    name: Propose lock update and dispatch validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update every input
        id: update
        run: |
          nix flake update 2> update.log
          cat update.log
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or refresh the pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Report the failing command and its stderr as an annotation, which
          # is readable without downloading the job log.
          exec 2> >(tee "$RUNNER_TEMP/propose.err" >&2)
          report() {
            local message="propose failed at line $1: $2"$'\n'
            message+=$(tail -n 20 "$RUNNER_TEMP/propose.err")
            echo "::error title=update-flake-lock::${message//$'\n'/%0A}"
          }
          trap 'report "$LINENO" "$BASH_COMMAND"' ERR
          branch=automation/update-flake-lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git commit -m "chore(flake): update inputs" -m "$(sed -n '/Updated input/,$p' update.log)" flake.lock
          git push --force origin "$branch"
          body="Weekly \`nix flake update\`. The check and Arch deployment lifecycle workflows run on this branch; review the input changes and their results, then merge to adopt them."
          if gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --body "$body"
          else
            gh pr create --head "$branch" --title "chore(flake): update inputs" --body "$body"
          fi
          gh workflow run check.yml --ref "$branch"
          gh workflow run container-test.yml --ref "$branch"
