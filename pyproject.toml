[project]
name = "nacre-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["rich"]

[tool.pyright]
include = ["checks", "lib", "modules", "platforms"]
typeCheckingMode = "standard"
useLibraryCodeForTypes = true
# Adapters import their sibling modules by name, as they run from the store.
executionEnvironments = [
  { root = "platforms/arch/core", extraPaths = ["platforms/arch/core"] },
  { root = "platforms/arch/system", extraPaths = ["platforms/arch/system"] },
  { root = "platforms/arch/ai", extraPaths = ["platforms/arch/ai"] },
]
# Production code is strict. Tests drive it through fakes and opt down with a
# "# pyright: standard" first line.
strict = ["lib", "modules", "platforms"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF",
    "C901", "PLR0911", "PLR0912", "PLR0915",
]
# The formatter owns line length.
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Entry points disable bytecode writes before importing their modules: as root
# they would otherwise write __pycache__ into the read-only store path.
"**/adapter.py" = ["E402"]

# Temporary: these functions are split in the readability refactor (S6-S10).
"lib/cli/nacre/nacre.py" = ["C901", "PLR0911", "PLR0912", "PLR0915"]
"modules/ai/benchmark.py" = ["C901", "PLR0912", "PLR0915"]
"modules/ai/prepare.py" = ["C901", "PLR0912"]
"modules/ai/probe.py" = ["C901", "PLR0912"]
"modules/ai/tests/test_router.py" = ["C901"]
"platforms/arch/ai/dmem_guard.py" = ["C901"]
"platforms/arch/ai/runtime.py" = ["C901", "PLR0912", "PLR0915"]
"platforms/arch/core/runtime.py" = ["C901", "PLR0912"]
"platforms/arch/core/tests/test_core.py" = ["C901", "PLR0912"]
"platforms/arch/system/firewall.py" = ["C901"]
"platforms/arch/system/runtime.py" = ["C901", "PLR0912", "PLR0915"]
"platforms/arch/system/tests/test_system.py" = ["C901", "PLR0912", "PLR0915"]
