[project]
name = "nacre-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["rich"]

[tool.pyright]
include = ["checks", "lib", "modules", "platforms"]
typeCheckingMode = "standard"
useLibraryCodeForTypes = true
# Adapters import their sibling modules by name, as they run from the store.
executionEnvironments = [
  { root = "platforms/arch/core", extraPaths = ["platforms/arch/core"] },
  { root = "platforms/arch/system", extraPaths = ["platforms/arch/system"] },
  { root = "platforms/arch/ai", extraPaths = ["platforms/arch/ai"] },
]
# Production code is strict. Tests drive it through fakes and opt down with a
# "# pyright: standard" first line.
strict = ["lib", "modules", "platforms"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
# The formatter owns line length.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Entry points disable bytecode writes before importing their modules: as root
# they would otherwise write __pycache__ into the read-only store path.
"**/adapter.py" = ["E402"]
