[project]
name = "nacre-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["rich"]

[tool.pyright]
include = ["checks", "lib", "modules", "platforms"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
useLibraryCodeForTypes = true
executionEnvironments = [
  { root = "platforms/arch/system", extraPaths = ["platforms/arch/system"] },
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
# The formatter owns line length.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Entry points disable bytecode writes before importing their modules: as root
# they would otherwise write __pycache__ into the read-only store path.
"**/adapter.py" = ["E402"]
